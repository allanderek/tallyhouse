name: Build and deploy the site

# Deployment runs here rather than from the collecting machine, and that is a
# deliberate choice rather than a convenience. `generate` is a pure function of
# committed data, so a build from a fresh clone that reproduces the published
# site is a continuous proof of the claim the whole project rests on: that a
# stranger can clone the repository and re-derive every figure. A build pushed
# from the machine that produced the data would prove nothing of the kind.
#
# Collection stays off CI. The index is about crawler etiquette, so the crawler
# must identify itself honestly from a stable, reputable address — not from a
# shared runner whose IP nobody can attribute.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run is pointless once a newer commit exists, but never cancel a
# deployment already in flight: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

# The runner image is pinned rather than `ubuntu-latest`. This workflow serves
# the public site, and an image that changes under us is exactly the sort of
# thing that breaks a deploy nobody is watching -- `ubuntu-latest` migrates to
# Ubuntu 26 from 2026-10-19. Pinning does not avoid that upgrade, it makes it a
# deliberate act: when this image is retired the build fails loudly, at a time we
# can choose to act on, which is the right failure mode for something
# load-bearing.
#
# There is no retirement date to plan around yet: GitHub keeps the latest two
# stable images, so 24.04 only becomes the oldest supported — and only then
# starts a deprecation clock — once an image newer than 26.04 reaches GA. Until
# that announcement there is nothing to do here, and a failed build is the
# signal to act. Bump it together with the action versions below.

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: pip install -r requirements.txt

      # Pinned exactly, matching the local toolchain: 0.19.2 demands a different
      # compiler and fails with an error that reads like a code fault.
      - run: npm install -g elm@0.19.1-5

      - name: Run both test suites
        run: ./check

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: pip install -r requirements.txt

      - run: npm install -g elm@0.19.1-5

      - name: Compile the generator
        working-directory: generate
        run: elm make src/Site.elm --optimize --output=site.js

      - name: Render the site
        env:
          PYTHONPATH: src
        run: python -m tallyhouse.cli generate --out site

      # Every internal link is relative, so the site works at any base path —
      # including the /tallyhouse/ prefix a project page is served under. This
      # check is here because a broken relative link renders perfectly and then
      # 404s silently, which is the sort of failure nobody reports.
      - name: Check every internal link resolves
        run: python .github/check_links.py site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
